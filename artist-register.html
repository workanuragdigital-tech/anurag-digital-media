<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Registration | Anurag Digital Media</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #080808, #151515);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 28px;
      color: #fff;
    }

    .logo span {
      color: #ff1744;
    }

    .logo p {
      color: #999;
      margin-top: 7px;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff1744;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ff1744;
      cursor: pointer;
      font-size: 13px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0;
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    .register-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #ff1744;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-btn:hover {
      background: #e9143d;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      background: #142d1c;
      color: #66e68a;
      font-size: 14px;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #999;
      font-size: 14px;
    }

    .login a {
      color: #ff1744;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>Anurag <span>Digital Media</span></h1>
      <p>Music Distribution & Artist Platform</p>
    </div>

    <h2>Artist Registration</h2>

    <form id="artistRegisterForm">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="artistName">Artist Name</label>
        <input
          type="text"
          id="artistName"
          name="artistName"
          placeholder="Your artist/stage name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input
          type="tel"
          id="mobile"
          name="mobile"
          placeholder="Enter mobile number"
          pattern="[0-9]{10}"
          maxlength="10"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="8"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            Show
          </button>
        </div>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          I agree to the Anurag Digital Media artist registration
          and platform terms.
        </label>
      </div>

      <button type="submit" class="register-btn">
        Create Artist Account
      </button>

      <div class="message" id="message">
        Registration form completed successfully.
        Backend account creation will be connected next.
      </div>

    </form>

    <div class="login">
      Already have an account?
      <a href="artist-login.html">Artist Login</a>
    </div>

    <a href="index.html" class="back">
      ← Back to Anurag Digital Media
    </a>

  </div>

  <script>

    function togglePassword() {
      const password = document.getElementById("password");
      const button = document.querySelector(".show-password");

      if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
      } else {
        password.type = "password";
        button.textContent = "Show";
      }
    }

    document
      .getElementById("artistRegisterForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const mobile = document.getElementById("mobile").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        if (!/^[0-9]{10}$/.test(mobile)) {
          alert("Please enter a valid 10-digit mobile number.");
          return;
        }

        if (password.length < 8) {
          alert("Password must contain at least 8 characters.");
          return;
        }

        message.style.display = "block";

        this.reset();
      });

  </script>

</body>
</html>
